// Quantum Relay optional Kerbalism reliability support.
// Requires Kerbalism's FeatureReliability and ModuleManager.
// Kerbalism handles quality selection, failures, and Engineer EVA repairs.
// MTBF values are in seconds, and are intentionally tiered.
// QR's compiled plugin must include the companion failure-state source patch
// before failed relays will shut down quantum gateway operations.

@PART[quantum-relay-qr-100]:HAS[!MODULE[Reliability]:HAS[#type[QuantumRelay]]]:NEEDS[FeatureReliability]:AFTER[KerbalismDefault]
{
    MODULE
    {
        name = Reliability
        type = QuantumRelay
        title = Quantum Relay
        redundancy = Communication
        repair = Engineer
        mtbf = 7257600
        extra_cost = 0.5
        extra_mass = 0.03
    }
}

