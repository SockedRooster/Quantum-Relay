// Quantum Relay
// QR-750 "Horizon Prime" — tier-four prime quantum array

PART
{
    module = Part
    author = Rooster Works
    category = Communication
    rescaleFactor = 1.10625

    node_stack_bottom = 0, -2.085872, 0, 0, -1, 0, 0
    attachRules = 1,0,1,1,0
    bulkheadProfiles = size2
    crashTolerance = 12
    maxTemp = 2000
    MODEL
    {
        model = QuantumRelay/Models/RW_QR750
        scale = 1, 1, 1
    }

    name = quantum-relay-qr-750
    title = QR-750 "Horizon Prime" Quantum Relay Array
    manufacturer = RoosterWorks Advanced Communications
    description = Horizon Prime is a tier-four quantum relay array built around a stabilized entanglement core and multi-band phase harmonizers. Its oversized reflector geometry supports the strongest hardware signal in the Quantum Relay family and is designed as the flagship hub for deep-space wormhole infrastructure.

    tags = quantum relay wormhole horizon prime communications commnet reflector gateway experimental deep space roosterworks tier4 flagship endgame

    TechRequired = artificialIntelligence
    entryCost = 320000
    cost = 155000
    mass = 5.75

    MODULE
    {
        name = ModuleQuantumRelay

        relayEnabled = true
        requiresDeployment = true
        deploymentModuleName = ModuleAnimateGeneric

        relayModel = QR-750 Horizon Prime
        relayClass = HorizonPrime
        deploymentLossGracePeriod = 2.0

        synchronizationDuration = 15
        idlePowerRate = 0.05
        synchronizationPowerRate = 6
        operationalPowerRate = 3.0

        enablePerHexEmission = true
        perHexGlowRadius = 0.22
        perHexGlowWidth = 0.030
        perHexMaximumEmitters = 64
        perHexConvergenceLines = true
    }

    // Stock converter-backed power loads. Dynamic Battery Storage and other
    // system monitors can identify these as normal EC consumers.
    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Quantum Relay Standby Power
        StartActionName = Start Standby Power
        StopActionName = Stop Standby Power
        ToggleActionName = Toggle Standby Power
        FillAmount = 1
        AutoShutdown = false
        GeneratesHeat = false
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 0.05
        }

        OUTPUT_RESOURCE
        {
            ResourceName = QuantumRelayPowerSink
            Ratio = 1
            DumpExcess = true
        }
    }

    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Quantum Relay Synchronization Power
        StartActionName = Start Synchronization Power
        StopActionName = Stop Synchronization Power
        ToggleActionName = Toggle Synchronization Power
        FillAmount = 1
        AutoShutdown = false
        GeneratesHeat = false
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 6
        }

        OUTPUT_RESOURCE
        {
            ResourceName = QuantumRelayPowerSink
            Ratio = 1
            DumpExcess = true
        }
    }

    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Quantum Relay Operational Power
        StartActionName = Start Operational Power
        StopActionName = Stop Operational Power
        ToggleActionName = Toggle Operational Power
        FillAmount = 1
        AutoShutdown = false
        GeneratesHeat = false
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 3.0
        }

        OUTPUT_RESOURCE
        {
            ResourceName = QuantumRelayPowerSink
            Ratio = 1
            DumpExcess = true
        }
    }

    MODULE
    {
        name = ModuleAnimateGeneric
        animationName = QR_Deploy
        startEventGUIName = Deploy Relay
        endEventGUIName = Retract Relay
        actionGUIName = Toggle Relay
        allowAnimationWhileShielded = False
    }
}
