// Quantum Relay custom technology node
// Requires ModuleManager. The node remains visible even before a dedicated relay part is introduced.
@TechTree:NEEDS[ModuleManager]
{
    RDNode
    {
        id = quantumRelayTechnology
        title = Quantum Relay Technology
        description = Experimental field manipulation, exotic communications theory, and reflector control systems make instantaneous communication across the Promised Worlds wormhole pair possible.
        cost = 1000
        hideEmpty = False
        nodeName = node_quantumRelayTechnology
        anyToUnlock = False
        icon = RDicon_electrics-experimental
        pos = -1180,1110,-1
        scale = 0.6

        Parent
        {
            parentID = experimentalElectrics
            lineFrom = RIGHT
            lineTo = LEFT
        }
    }
}
