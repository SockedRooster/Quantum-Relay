// Quantum Relay
// QR-250 "Voyager" Quantum Relay
//
// Creates a separate Tier 2 relay by cloning Near Future Exploration's giant
// deployable reflector. No Near Future assets are redistributed.
//
// Dependencies:
//   Near Future Exploration
//   ModuleManager
//   Quantum Relay

+PART[nfex-antenna-reflector-giant-1]:NEEDS[NearFutureExploration,QuantumRelay]
{
    @name = quantum-relay-qr-250
    @title = QR-250 "Voyager" Quantum Relay
    @manufacturer = RoosterWorks Advanced Communications
    @description = The Voyager is a second-generation quantum relay designed for permanent interplanetary infrastructure. Its expanded field geometry and refined entanglement core synchronize much faster than the Pioneer while demanding less continuous power. The enormous reflector is not subtle, inexpensive, or easy to launch, but deep-space network planners rarely ask for subtle.

    @tags = quantum relay wormhole voyager communications commnet reflector gateway interplanetary deep space roosterworks tier2

    // Tier-two career placement and balance.
    @TechRequired = automation
    @entryCost = 92000
    @cost = 42500
    @mass = 2.40

    // Preserve the reflector's stock/Near Future deployment and antenna
    // behaviour, but ensure exactly one Quantum Relay module is installed.
    !MODULE[ModuleQuantumRelay],* {}

    MODULE
    {
        name = ModuleQuantumRelay

        relayEnabled = true
        requiresDeployment = true
        deploymentModuleName = ModuleDeployableReflector

        relayModel = QR-250 Voyager
        relayTier = 2

        // Second-generation hardware.
        synchronizationTime = 22
        operationalPowerRate = 5.0
    }
}
