// Quantum Relay
// QR-250 "Voyager" — refined medium reflector

+PART[nfex-antenna-reflector-huge-1]:NEEDS[NearFutureExploration,QuantumRelay]
{
    @name = quantum-relay-qr-250
    @title = QR-250 "Voyager" Quantum Relay
    @manufacturer = RoosterWorks Advanced Communications
    @description = The Voyager is a second-generation quantum relay designed for permanent interplanetary infrastructure. Improved field geometry allows a substantially smaller reflector than the Pioneer while synchronizing faster and consuming less continuous power.

    @tags = quantum relay wormhole voyager communications commnet reflector gateway interplanetary deep space roosterworks tier2

    @TechRequired = automation
    @entryCost = 92000
    @cost = 42500
    @mass = 2.40

    !MODULE[ModuleQuantumRelay],* {}

    MODULE
    {
        name = ModuleQuantumRelay

        relayEnabled = true
        requiresDeployment = true
        deploymentModuleName = ModuleDeployableReflector

        relayModel = QR-250 Voyager
        relayClass = Voyager
        deploymentLossGracePeriod = 2.0

        synchronizationDuration = 22
        idlePowerRate = 0.02
        synchronizationPowerRate = 1.0
        operationalPowerRate = 5.0

        enablePerHexEmission = true
        perHexGlowRadius = 0.13
        perHexGlowWidth = 0.021
        perHexMaximumEmitters = 32
        perHexConvergenceLines = true
    }

    // Stock converter-backed power loads. Dynamic Battery Storage and other
    // system monitors can identify these as normal EC consumers.
    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Quantum Relay Standby Power
        StartActionName = Start Standby Power
        StopActionName = Stop Standby Power
        ToggleActionName = Toggle Standby Power
        FillAmount = 1
        AutoShutdown = false
        GeneratesHeat = false
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 0.02
        }

        OUTPUT_RESOURCE
        {
            ResourceName = QuantumRelayPowerSink
            Ratio = 1
            DumpExcess = true
        }
    }

    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Quantum Relay Synchronization Power
        StartActionName = Start Synchronization Power
        StopActionName = Stop Synchronization Power
        ToggleActionName = Toggle Synchronization Power
        FillAmount = 1
        AutoShutdown = false
        GeneratesHeat = false
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 1.0
        }

        OUTPUT_RESOURCE
        {
            ResourceName = QuantumRelayPowerSink
            Ratio = 1
            DumpExcess = true
        }
    }

    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Quantum Relay Operational Power
        StartActionName = Start Operational Power
        StopActionName = Stop Operational Power
        ToggleActionName = Toggle Operational Power
        FillAmount = 1
        AutoShutdown = false
        GeneratesHeat = false
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 5.0
        }

        OUTPUT_RESOURCE
        {
            ResourceName = QuantumRelayPowerSink
            Ratio = 1
            DumpExcess = true
        }
    }

}
