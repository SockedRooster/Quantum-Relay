// Quantum Relay
// QR-500 "Event Horizon" Quantum Relay
//
// Creates the final Tier 3 relay by cloning Near Future Exploration's largest
// folding side reflector. No Near Future assets are redistributed.
//
// Dependencies:
//   Near Future Exploration
//   ModuleManager
//   Quantum Relay

+PART[nfex-antenna-reflector-side-3]:NEEDS[NearFutureExploration,QuantumRelay]
{
    @name = quantum-relay-qr-500
    @title = QR-500 "Event Horizon" Quantum Relay
    @manufacturer = RoosterWorks Advanced Communications
    @description = Officially, the Event Horizon is an experimental third-generation quantum relay. Unofficially, it is what happens when the engineering team is given an unlimited research budget and told that causality is merely a design constraint. Its segmented folding field array establishes a stable quantum bridge in seconds while drawing less continuous power than earlier relays. Procurement would like to remind operators that the purchase price does not include the launch vehicle, power reserve, or existential reassurance.

    @tags = quantum relay wormhole event horizon communications commnet reflector gateway experimental deep space roosterworks tier3 endgame folding

    // End-game career placement and balance.
    @TechRequired = experimentalElectrics
    @entryCost = 180000
    @cost = 87500
    @mass = 3.20

    // Preserve the original deployment behaviour while ensuring that this
    // clone receives exactly one Quantum Relay module.
    !MODULE[ModuleQuantumRelay],* {}

    MODULE
    {
        name = ModuleQuantumRelay

        relayEnabled = true
        requiresDeployment = true
        deploymentModuleName = ModuleDeployableReflector

        relayModel = QR-500 Event Horizon
        relayTier = 3

        // Third-generation experimental hardware.
        synchronizationTime = 8
        operationalPowerRate = 3.0
    }
}
