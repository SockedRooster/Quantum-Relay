// Quantum Relay
// QR-500 "Event Horizon" — advanced giant dish

+PART[nfex-antenna-reflector-giant-1]:NEEDS[NearFutureExploration,QuantumRelay]
{
    @name = quantum-relay-qr-500
    @title = QR-500 "Event Horizon" Quantum Relay
    @manufacturer = RoosterWorks Advanced Communications
    @description = The Event Horizon is an experimental third-generation quantum relay. Precision quantum optics and compact field emitters establish a stable bridge in seconds, replacing the sprawling prototype arrays of earlier generations with a highly engineered phase-stabilization dish.

    @tags = quantum relay wormhole event horizon communications commnet reflector gateway experimental deep space roosterworks tier3 endgame

    @TechRequired = experimentalElectrics
    @entryCost = 180000
    @cost = 87500
    @mass = 3.20

    !MODULE[ModuleQuantumRelay],* {}

    MODULE
    {
        name = ModuleQuantumRelay

        relayEnabled = true
        requiresDeployment = true
        deploymentModuleName = ModuleDeployableReflector

        relayModel = QR-500 Event Horizon
        relayTier = 3
        signalStrength = 1.00
        deploymentLossGracePeriod = 2.0

        synchronizationDuration = 8
        idlePowerRate = 0.02
        synchronizationPowerRate = 1.0
        operationalPowerRate = 3.0
    }

    // Stock converter-backed power loads. Dynamic Battery Storage and other
    // system monitors can identify these as normal EC consumers.
    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Quantum Relay Standby Power
        StartActionName = Start Standby Power
        StopActionName = Stop Standby Power
        ToggleActionName = Toggle Standby Power
        FillAmount = 1
        AutoShutdown = false
        GeneratesHeat = false
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 0.02
        }

        OUTPUT_RESOURCE
        {
            ResourceName = QuantumRelayPowerSink
            Ratio = 1
            DumpExcess = true
        }
    }

    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Quantum Relay Synchronization Power
        StartActionName = Start Synchronization Power
        StopActionName = Stop Synchronization Power
        ToggleActionName = Toggle Synchronization Power
        FillAmount = 1
        AutoShutdown = false
        GeneratesHeat = false
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 1.0
        }

        OUTPUT_RESOURCE
        {
            ResourceName = QuantumRelayPowerSink
            Ratio = 1
            DumpExcess = true
        }
    }

    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Quantum Relay Operational Power
        StartActionName = Start Operational Power
        StopActionName = Stop Operational Power
        ToggleActionName = Toggle Operational Power
        FillAmount = 1
        AutoShutdown = false
        GeneratesHeat = false
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 3.0
        }

        OUTPUT_RESOURCE
        {
            ResourceName = QuantumRelayPowerSink
            Ratio = 1
            DumpExcess = true
        }
    }

}
