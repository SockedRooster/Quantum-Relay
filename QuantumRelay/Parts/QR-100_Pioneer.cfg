// Quantum Relay
// QR-100 "Pioneer" — large folding prototype array

+PART[nfex-antenna-reflector-side-3]:NEEDS[NearFutureExploration,QuantumRelay]
{
    @name = quantum-relay-qr-100
    @title = QR-100 "Pioneer" Quantum Relay
    @manufacturer = RoosterWorks Advanced Communications
    @description = The Pioneer is RoosterWorks' first production quantum-relay terminal. Its oversized folding field array reflects the brute-force engineering of first-generation quantum hardware: slow to synchronize, demanding on electrical systems, but rugged and relatively affordable.

    @tags = quantum relay wormhole pioneer communications commnet reflector gateway roosterworks tier1 prototype folding

    @TechRequired = largeUnmanned
    @entryCost = 42000
    @cost = 18500
    @mass = 1.35

    !MODULE[ModuleQuantumRelay],* {}

    MODULE
    {
        name = ModuleQuantumRelay

        relayEnabled = true
        requiresDeployment = true
        deploymentModuleName = ModuleDeployableReflector

        relayModel = QR-100 Pioneer
        relayClass = Pioneer
        deploymentLossGracePeriod = 2.0

        synchronizationDuration = 45
        idlePowerRate = 0.02
        synchronizationPowerRate = 1.0
        operationalPowerRate = 7.5

        enablePerHexEmission = true
        perHexGlowRadius = 0.10
        perHexGlowWidth = 0.018
        perHexMaximumEmitters = 24
        perHexConvergenceLines = true
    }

    // Stock converter-backed power loads. Dynamic Battery Storage and other
    // system monitors can identify these as normal EC consumers.
    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Quantum Relay Standby Power
        StartActionName = Start Standby Power
        StopActionName = Stop Standby Power
        ToggleActionName = Toggle Standby Power
        FillAmount = 1
        AutoShutdown = false
        GeneratesHeat = false
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 0.02
        }

        OUTPUT_RESOURCE
        {
            ResourceName = QuantumRelayPowerSink
            Ratio = 1
            DumpExcess = true
        }
    }

    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Quantum Relay Synchronization Power
        StartActionName = Start Synchronization Power
        StopActionName = Stop Synchronization Power
        ToggleActionName = Toggle Synchronization Power
        FillAmount = 1
        AutoShutdown = false
        GeneratesHeat = false
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 1.0
        }

        OUTPUT_RESOURCE
        {
            ResourceName = QuantumRelayPowerSink
            Ratio = 1
            DumpExcess = true
        }
    }

    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Quantum Relay Operational Power
        StartActionName = Start Operational Power
        StopActionName = Stop Operational Power
        ToggleActionName = Toggle Operational Power
        FillAmount = 1
        AutoShutdown = false
        GeneratesHeat = false
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 7.5
        }

        OUTPUT_RESOURCE
        {
            ResourceName = QuantumRelayPowerSink
            Ratio = 1
            DumpExcess = true
        }
    }

}
