// Quantum Relay
// QR-100 "Pioneer" Quantum Relay
//
// This part is created at ModuleManager load time by cloning the Near Future
// Exploration RFL-2000 reflector. No Near Future assets are redistributed.
//
// Dependency:
//   Near Future Exploration
//   ModuleManager
//   Quantum Relay

+PART[nfex-antenna-reflector-huge-1]:NEEDS[NearFutureExploration,QuantumRelay]
{
    @name = quantum-relay-qr-100
    @title = QR-100 "Pioneer" Quantum Relay
    @manufacturer = RoosterWorks Advanced Communications
    @description = The Pioneer is RoosterWorks' first production quantum-relay terminal. Built around proven reflector hardware, it trades efficiency and startup speed for rugged construction and a relatively approachable price. Deploy the array, provide probe control and CommNet hardware, and keep a substantial ElectricCharge reserve available while the quantum core synchronizes.

    @tags = quantum relay wormhole pioneer communications commnet reflector gateway roosterworks

    // Tier-one career placement and balance.
    @TechRequired = largeUnmanned
    @entryCost = 42000
    @cost = 18500
    @mass = 1.35

    // Preserve the original reflector deployment and antenna modules while
    // replacing any relay module inherited from another patch.
    !MODULE[ModuleQuantumRelay],* {}

    MODULE
    {
        name = ModuleQuantumRelay

        relayEnabled = true
        requiresDeployment = true
        deploymentModuleName = ModuleDeployableReflector

        relayModel = QR-100 Pioneer
        relayTier = 1

        // First-generation hardware: deliberately slow and power hungry.
        synchronizationTime = 45
        operationalPowerRate = 7.5
    }
}
